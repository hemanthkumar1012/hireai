version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: applyright-db
    restart: always
    environment:
      POSTGRES_USER: applyright_user
      POSTGRES_PASSWORD: applyright_password
      POSTGRES_DB: applyright_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql

  redis:
    image: redis:7-alpine
    container_name: applyright-cache
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: applyright-backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql://applyright_user:applyright_password@postgres:5432/applyright_prod
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=mock
      - SECRET_KEY=87f2e6b9a89d71c4c3b5d2e0f4a3e2d1c9b8a7f6e5d4c3b2a1
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: applyright-worker
    restart: always
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://applyright_user:applyright_password@postgres:5432/applyright_prod
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=mock
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: ../frontend
      dockerfile: ../backend/Dockerfile # Reuse base, or run node container. Running natively is often preferred.
    image: node:18-alpine
    container_name: applyright-frontend
    working_dir: /app
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  pgdata:
